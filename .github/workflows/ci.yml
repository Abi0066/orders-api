name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write   # push to ghcr.io from the image job
  id-token: write   # keyless signing: OIDC token -> short-lived Fulcio certificate

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build image for scanning
        run: docker build -t orders-api:ci .

      # Fails the job on CRITICAL/HIGH vulnerabilities that have a fix available.
      # `ignore-unfixed` keeps the signal actionable instead of blocking on base
      # image issues nobody can patch from here.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: orders-api:ci
          version: v0.76.2
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Publishing happens only after the scan passes, and only on main: a pull
      # request builds and scans, it does not create a package version.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/abi0066/orders-api:sha-${{ github.sha }}
            ghcr.io/abi0066/orders-api:latest
          # buildx attaches build provenance and an SPDX SBOM as OCI attestations
          # next to the image, readable with `docker buildx imagetools inspect`.
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v4.1.3

      # Keyless: the workflow's OIDC token is exchanged for a short-lived
      # certificate, so there is no long-lived signing key to store or leak. The
      # signature is attached to the digest, i.e. to the exact bytes that were
      # scanned two steps earlier.
      - name: Sign the image (keyless)
        if: github.event_name == 'push'
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/abi0066/orders-api:sha-${{ github.sha }}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "signing ghcr.io/abi0066/orders-api@${digest}"
          cosign sign --yes "ghcr.io/abi0066/orders-api@${digest}"

      # The sha tag is immutable, so the GitOps repository can pin exactly what was
      # built, scanned and signed. Nothing here bumps orders-gitops: that commit is a
      # deliberate release step, not a side effect of a merge.
      - name: Summary
        if: github.event_name == 'push'
        run: |
          {
            echo "### Image published, scanned and signed"
            echo ""
            echo '`ghcr.io/abi0066/orders-api:sha-'"${{ github.sha }}"'`'
            echo ""
            echo "Verify it:"
            echo '```'
            echo "cosign verify ghcr.io/abi0066/orders-api:sha-${{ github.sha }} \\"
            echo "  --certificate-identity-regexp 'https://github.com/Abi0066/orders-api/.github/workflows/ci.yml@refs/heads/main' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo ""
            echo "Next: pin that tag in the GitOps repo with \`scripts/bump-and-push.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"
