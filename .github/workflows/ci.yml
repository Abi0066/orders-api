name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        run: docker build -t orders-api:ci .

      # Fails the job on CRITICAL/HIGH vulnerabilities that have a fix available.
      # `ignore-unfixed` keeps the signal actionable instead of blocking on base
      # image issues nobody can patch from here.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: orders-api:ci
          version: v0.76.2
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Nothing is pushed on purpose: images reach the demo cluster through
      # `kind load`, and the GitOps repository owns the deployment.
